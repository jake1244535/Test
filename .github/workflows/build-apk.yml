name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Node Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          npm run build

      - name: Sync Capacitor Android
        run: |
          npx cap sync android

      - name: Grant Execute Permission for Gradle
        run: |
          chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/AmericanTruckSimulator.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/app-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmericanTruckSimulator-Android-APK
          path: output_apk/AmericanTruckSimulator.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: latest
          name: "American Truck Simulator 3D - APK (Android)"
          draft: false
          prerelease: false
          body: |
            ## 🚚 American Truck Simulator 3D - APK para Android
            ¡Tu APK ya está listo para descargar e instalar directamente en tu celular Android!

            ### 📦 Descarga directa:
            Descarga el archivo adjunto **`AmericanTruckSimulator.apk`** que está abajo en la sección de **Assets**.

            ### 📲 Instrucciones de instalación:
            1. Descarga **`AmericanTruckSimulator.apk`** en tu teléfono Android.
            2. Toca la notificación de descarga o abre el archivo desde tu gestor de archivos / descargas.
            3. Si te sale la advertencia de seguridad, activa **"Permitir desde esta fuente"** (Orígenes desconocidos).
            4. Toca **Instalar** y ¡listo para conducir!
          files: |
            output_apk/AmericanTruckSimulator.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
